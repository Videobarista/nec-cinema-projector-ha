# Status against the Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Custom integrations are not graded by Home Assistant; this file records how the
# integration aligns with the Bronze tier. Higher tiers are not claimed.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Polled every 10 seconds by default, adjustable in the options from 2 to 300.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No external requirements; the protocol client is part of the integration.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; they read coordinator data.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >-
      A cinema projector switched off at the mains is a normal state. A projector that
      answered before is set up from what it reported then and shown as off; only one that
      has never answered keeps the entry waiting (ConfigEntryNotReady).
  unique-config-entry: done
